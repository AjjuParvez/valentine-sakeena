<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine for Sakeena Fathima</title>

<style>
:root{
  --pink:#ff3f8e;
  --hot:#ff1e6e;
  --bg:#ffd9ea;
  --text:#2b2b2b;
  --card:#ffffff;

  /* Mobile safe area */
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html,body{
  margin:0; padding:0;
  height:100%; overflow:hidden;
  background: var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--text);
}

/* Watermark background */
.wm{
  position:fixed; inset:0; pointer-events:none;
  opacity:.10; z-index:0;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text x='16' y='70' font-size='44'>💖</text></svg>") left top / 120px 120px repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><text x='44' y='86' font-size='42'>💞</text></svg>") 60px 60px / 140px 140px repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><text x='54' y='100' font-size='42'>💘</text></svg>") 20px 100px / 160px 160px repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110'><text x='42' y='66' font-size='26'>✨</text></svg>") 90px 10px / 110px 110px repeat;
}

.wrap{
  height:100%; display:grid; place-items:center;
  position:relative; z-index:1; padding:18px;
}

.card{
  width:min(94vw, 680px);
  padding:34px 26px 40px;
  background:var(--card);
  border-radius:22px;
  text-align:center;
  box-shadow:0 14px 42px rgba(255,63,142,.20),
             0 6px 18px rgba(0,0,0,.05);
  border: 1px solid #ffe0ee;
}

h1{
  color:var(--pink);
  font-size:clamp(26px,5.2vw,40px);
  margin:0 0 12px;
  min-height:70px;
}

.subtitle{ opacity:.7; margin-top:-4px; }

.btns{
  margin-top:18px;
  display:flex; gap:16px;
  justify-content:center;
  min-height:140px;
}

button{
  padding:16px 28px;
  font-size:20px; font-weight:700;
  border:none; border-radius:999px;
  cursor:pointer; user-select:none;
}

.yes{
  background:linear-gradient(180deg, var(--pink), var(--hot));
  color:#fff;
}
.yes:hover{ transform:scale(1.05); }

.no{
  background:#fff;
  color:var(--pink);
  border:2px solid var(--pink);
  position:relative;
  z-index:50;
}

.footer{ opacity:.6; margin-top:8px; }

/*** Overlay ***/
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:none; z-index:9999;
  justify-content:center; align-items:center;
}
.overlay.show{ display:flex; }

.wrapGif{
  background:#000;
  padding:10px; border-radius:16px;
  max-width:min(94vw, 540px);
}
.yay{
  position:absolute;
  top:14px; left:50%; transform:translateX(-50%);
  color:white; font-size:40px; font-weight:900;
}
.overlay img{ width:100%; border-radius:12px; }

/*** Heart burst items ***/
.heart{
  position:fixed; z-index:999;
  font-size:20px;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="wm"></div>

<div class="wrap">
  <div class="card">
    <h1 id="title"></h1>
    <p class="subtitle">I promise unlimited smiles and your favorite snacks. 😄</p>

    <div class="btns">
      <button class="yes" id="yesBtn">Yes 💕</button>
      <button class="no" id="noBtn">No 😅</button>
    </div>

    <div class="footer">(Try tapping “No”) 😉</div>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="wrapGif">
    <div class="yay">YAY 🎉</div>
    <img id="gif">
  </div>
</div>

<script>
/* Typing effect */
const title = document.getElementById("title");
const msg = "Sakeena Fathima,\nwill you be my Valentine? 💖";
let i = 0;
(function type(){
  if(i < msg.length){
    title.innerHTML += msg[i] === "\n" ? "<br>" : msg[i];
    i++;
    setTimeout(type, 26);
  }
})();

/* Buttons */
const yesBtn = document.getElementById("yesBtn");
const noBtn  = document.getElementById("noBtn");
const overlay= document.getElementById("overlay");
const gifImg = document.getElementById("gif");

/* Keep No always visible — safe area fix */
function vp(){
  const v = window.visualViewport;
  return {
    w: v ? v.width  : innerWidth,
    h: v ? v.height : innerHeight
  }
}
function clamp(v,min,max){ return Math.min(Math.max(v,min),max); }

/* Position No button randomly but always on screen */
function moveNoRandom(){
  const r = noBtn.getBoundingClientRect();
  const v = vp();
  const pad = 12;

  const maxX = v.w - r.width  - pad;
  const maxY = v.h - r.height - pad;

  const x = clamp(Math.random()*maxX, pad, maxX);
  const y = clamp(Math.random()*maxY, pad, maxY);

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";
}

let roaming = false;

/* Trigger roaming */
["mouseenter","mouseover","mousemove","touchstart","click"].forEach(evt=>{
  noBtn.addEventListener(evt, e=>{
    e.preventDefault();

    if(!roaming){
      roaming = true;
      noBtn.style.position = "fixed";
    }

    moveNoRandom();
  }, {passive:false});
});

/* YES — Show GIF + heart burst */
yesBtn.onclick = ()=>{
  title.textContent = "YAY! 💘";
  heartBurst(30);

  gifImg.src = "https://media.giphy.com/media/3kvYEldEEr0DC/giphy.gif";
  overlay.classList.add("show");
  noBtn.disabled = true;
  noBtn.style.opacity=.4;
};

/* Close overlay */
overlay.onclick = ()=> overlay.classList.remove("show");

/* Heart burst animation */
function heartBurst(n){
  const hearts = ["💖","💘","💝","💕","💗"];
  const cx = innerWidth/2, cy = innerHeight/2;

  for(let i=0;i<n;i++){
    const span = document.createElement("span");
    span.className = "heart";
    span.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    span.style.left = cx + "px";
    span.style.top  = cy + "px";

    const angle = Math.random()*Math.PI*2;
    const dist  = 80 + Math.random()*140;

    const x = Math.cos(angle)*dist;
    const y = Math.sin(angle)*dist;

    span.animate([
      {transform:"translate(-50%,-50%) scale(1)", opacity:1},
      {transform:`translate(${x}px,${y}px) scale(0.8)`, opacity:0}
    ],{
      duration:900 + Math.random()*500,
      easing:"ease-out",
      fill:"forwards"
    });

    document.body.appendChild(span);
    setTimeout(()=>span.remove(),1500);
  }
}
</script>

</body>
</html>
