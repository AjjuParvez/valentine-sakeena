<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine for Sakeena Fathima</title>

<style>
/* COLORS */
:root{
  --pink:#ff3f8e;
  --hot:#ff1e6e;
  --bg:#ffd9ea; /* plain soft pink */
  --text:#2b2b2b;
  --card:#ffffff;
}

/* BACKGROUND */
html,body{
  margin:0; padding:0;
  height:100%; overflow:hidden;
  background: var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--text);
}

/* 💗 Heart Emoji Watermark Background */
.watermark{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.13;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><text x='45' y='90' font-size='48'>💖</text></svg>") repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><text x='50' y='100' font-size='52'>💕</text></svg>") repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><text x='60' y='110' font-size='56'>💞</text></svg>") repeat;
}

/* CENTER CARD */
.wrap{
  height:100%; display:grid; place-items:center;
  position:relative; z-index:1;
}
.card{
  width:min(94vw, 680px);
  padding:34px 26px 40px;
  background:white;
  border-radius:22px;
  text-align:center;
  box-shadow:0 16px 42px rgba(255,63,142,.20);
  border:1px solid #ffe0ee;
}

/* TITLE */
h1{
  color:var(--pink);
  margin:0 0 12px;
  font-size:clamp(26px,5vw,40px);
  min-height:70px;
}

/* SUBTITLE */
.subtitle{
  opacity:.7;
}

/* BUTTON AREA */
.btns{
  margin-top:18px;
  display:flex; justify-content:center;
  gap:16px;
  min-height:140px;
  position:relative;
}

/* BUTTONS */
button{
  font-size:20px; font-weight:700;
  padding:16px 28px;
  border:none; border-radius:999px;
  cursor:pointer;
}

.yes{
  background:linear-gradient(180deg, var(--pink), var(--hot));
  color:white;
}
.yes:hover{ transform:scale(1.05); }

.no{
  background:white;
  color:var(--pink);
  border:2px solid var(--pink);
  position:absolute;   /* THIS keeps it inside button area */
  z-index:5;
}

/* FOOTER */
.footer{
  opacity:.6;
  margin-top:6px;
}

/* OVERLAY */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:none; z-index:9999;
  justify-content:center; align-items:center;
}
.overlay.show{ display:flex; }
.overlay img{
  width:100%; max-width:460px;
  border-radius:12px;
}
.yay{
  position:absolute;
  top:14px; left:50%; transform:translateX(-50%);
  color:white; font-size:40px; font-weight:900;
}

/* HEART BURST */
.heart{
  position:fixed;
  font-size:22px;
  pointer-events:none;
  z-index:999;
}
</style>
</head>

<body>

<!-- ❤️ WATERMARK -->
<div class="watermark"></div>

<!-- CARD -->
<div class="wrap">
  <div class="card">
    <h1 id="title"></h1>
    <p class="subtitle">I promise unlimited smiles and your favorite snacks. 😄</p>

    <div class="btns" id="btnBox">
      <button class="yes" id="yesBtn">Yes 💕</button>
      <button class="no" id="noBtn">No 😅</button>
    </div>

    <div class="footer">(Try tapping “No”) 😉</div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="wrapGif">
    <div class="yay">YAY 🎉</div>
    <img id="gif">
  </div>
</div>

<script>
/* TYPING TITLE */
const title = document.getElementById("title");
const msg = "Sakeena Fathima,\nwill you be my Valentine? 💖";
let i = 0;
(function type(){
  if(i < msg.length){
    title.innerHTML += msg[i] === "\n" ? "<br>" : msg[i];
    i++;
    setTimeout(type, 26);
  }
})();

/* BUTTONS */
const yesBtn = document.getElementById("yesBtn");
const noBtn  = document.getElementById("noBtn");
const box    = document.getElementById("btnBox");
const overlay= document.getElementById("overlay");
const gif    = document.getElementById("gif");

/* ❤️ KEEP NO BUTTON INSIDE CARD */
function moveNo(){
  const boxRect = box.getBoundingClientRect();
  const noRect  = noBtn.getBoundingClientRect();

  const padding = 10;

  const maxX = boxRect.width - noRect.width  - padding;
  const maxY = boxRect.height- noRect.height - padding;

  const x = Math.random()*maxX;
  const y = Math.random()*maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";
}

/* Trigger NO jump */
["mouseenter","mouseover","mousemove","touchstart"].forEach(evt=>{
  noBtn.addEventListener(evt, e=>{
    e.preventDefault();
    moveNo();
  });
});

/* YES CLICK */
yesBtn.onclick = ()=>{
  title.textContent = "YAY! 💘";
  heartBurst(30);

  gif.src = "https://media.giphy.com/media/3kvYEldEEr0DC/giphy.gif";
  overlay.classList.add("show");
};

overlay.onclick = ()=> overlay.classList.remove("show");

/* HEART BURST */
function heartBurst(n){
  const hearts = ["💖","💘","💝","💕","💗"];
  for(let i=0;i<n;i++){
    const span = document.createElement("span");
    span.className = "heart";
    span.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    span.style.left = (innerWidth/2) + "px";
    span.style.top  = (innerHeight/2) + "px";

    const angle = Math.random()*Math.PI*2;
    const dist  = 80 + Math.random()*120;
    const x = Math.cos(angle)*dist;
    const y = Math.sin(angle)*dist;

    span.animate([
      {transform:"translate(-50%, -50%) scale(1)", opacity:1},
      {transform:`translate(${x}px,${y}px) scale(.8)`, opacity:0}
    ],{
      duration:900 + Math.random()*400,
      easing:"ease-out",
      fill:"forwards"
    });

    document.body.appendChild(span);
    setTimeout(()=>span.remove(),1500);
  }
}
</script>

</body>
</html>
