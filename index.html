<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine for Sakeena Fathima</title>

<style>
:root{
  --pink:#ff3f8e;
  --hot:#ff1e6e;
  --bg:#ffd9ea;
  --text:#2b2b2b;
  --card:#ffffff;
}

/* BACKGROUND */
html,body{
  margin:0; padding:0;
  height:100%; overflow:hidden;
  background:var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--text);
}

/* 💗 HEART WATERMARK */
.watermark{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.12;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><text x='45' y='90' font-size='50'>💖</text></svg>") repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><text x='55' y='110' font-size='55'>💕</text></svg>") repeat;
}

/* MAIN CARD */
.wrap{
  height:100%; display:grid; place-items:center;
  position:relative; z-index:1;
}
.card{
  width:min(94vw, 680px);
  padding:40px 26px 52px;
  background:white;
  border-radius:26px;
  text-align:center;
  box-shadow:0 16px 42px rgba(255,63,142,.20);
  border:1px solid #ffe0ee;
}

/* TITLE */
h1{
  color:var(--pink);
  font-size:clamp(26px,5vw,40px);
  margin:0 0 20px;
  min-height:70px;
}

/* BUTTON ROW */
.btns{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:10px;
}

/* BUTTONS */
button{
  padding:14px 28px;
  font-size:20px; 
  font-weight:700;
  border:none; 
  border-radius:999px;
  cursor:pointer; 
  user-select:none;
}

.yes{
  background:linear-gradient(180deg, var(--pink), var(--hot));
  color:white;
  position:relative;
  z-index:10;
}

.no{
  background:white;
  color:var(--pink);
  border:2px solid var(--pink);
  position:fixed;     /* roam full screen */
  z-index:50;
}

/* BOUNCE + ROTATE ANIMATION */
@keyframes bounceSpin {
  0%   { transform: scale(1) rotate(0deg); }
  35%  { transform: scale(1.25) rotate(15deg); }
  60%  { transform: scale(0.9) rotate(-15deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.no.animateBounce{
  animation: bounceSpin 0.45s ease-out;
}

/* FOOTER */
.footer{ 
  margin-top:12px; 
  opacity:.65;
}

/* OVERLAY */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:none; z-index:9999;
  justify-content:center; align-items:center;
}
.overlay.show{ display:flex; }

.wrapGif img{
  width:100%; max-width:460px;
  border-radius:14px;
}
.yay{
  position:absolute;
  top:14px; left:50%; transform:translateX(-50%);
  color:white; font-size:40px; font-weight:900;
}

/* HEART BURST */
.heart{
  position:fixed;
  font-size:22px;
  pointer-events:none;
  z-index:999;
}
</style>
</head>

<body>

<div class="watermark"></div>

<div class="wrap">
  <div class="card">
    <h1 id="title"></h1>

    <div class="btns">
      <button class="no" id="noBtn">No 😅</button>
      <button class="yes" id="yesBtn">Yes 💕</button>
    </div>

    <div class="footer">(Try tapping “No”) 😉</div>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="wrapGif">
    <div class="yay">YAY 🎉</div>
    <img id="gif">
  </div>
</div>

<script>
/* TYPING EFFECT */
const title = document.getElementById("title");
const msg   = "Sakeena Fathima,\nwill you be my Valentine? 💖";
let i = 0;
(function type(){
  if(i < msg.length){
    title.innerHTML += msg[i] === "\n" ? "<br>" : msg[i];
    i++;
    setTimeout(type, 26);
  }
})();

/* BUTTON LOGIC */
const yesBtn = document.getElementById("yesBtn");
const noBtn  = document.getElementById("noBtn");
const overlay= document.getElementById("overlay");
const gif    = document.getElementById("gif");

/* ❤️ NO BUTTON JUMPS ANYWHERE */
function moveNoAnywhere(){
  const padding = 20;
  const maxX = window.innerWidth  - noBtn.offsetWidth  - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  // random rotation
  const angle = Math.floor(Math.random() * 360);

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";
  noBtn.style.transform = `rotate(${angle}deg)`;

  // bounce animation
  noBtn.classList.remove("animateBounce");
  void noBtn.offsetWidth;
  noBtn.classList.add("animateBounce");
}

/* Trigger NO jump */
["mouseenter","mouseover","mousemove","touchstart","click"].forEach(evt=>{
  noBtn.addEventListener(evt, e=>{
    e.preventDefault();
    moveNoAnywhere();
  });
});

/* YES BUTTON */
yesBtn.onclick = ()=>{
  title.textContent = "YAY! 💘";
  heartBurst(30);
  gif.src = "https://media.giphy.com/media/3kvYEldEEr0DC/giphy.gif";
  overlay.classList.add("show");
};

overlay.onclick = ()=> overlay.classList.remove("show");

/* HEART BURST */
function heartBurst(n){
  const hearts = ["💖","💘","💝","💕","💗"];
  for(let i=0;i<n;i++){
    const span = document.createElement("span");
    span.className = "heart";
    span.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    span.style.left = (innerWidth/2) + "px";
    span.style.top  = (innerHeight/2) + "px";

    const angle = Math.random()*Math.PI*2;
    const dist  = 80 + Math.random()*140;
    const x = Math.cos(angle)*dist;
    const y = Math.sin(angle)*dist;

    span.animate([
      {transform:"translate(-50%, -50%) scale(1)", opacity:1},
      {transform:`translate(${x}px,${y}px) scale(.8)`, opacity:0}
    ],{
      duration:1000 + Math.random()*400,
      easing:"ease-out",
      fill:"forwards"
    });

    document.body.appendChild(span);
    setTimeout(()=>span.remove(),1500);
  }
}
</script>

</body>
</html>
