<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentine for Sakeena Fathima</title>
https://fonts.googleapis.com
https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap
<style>
  :root{
    --pink:#ff3f8e;
    --hot:#ff1e6e;
    --light:#fff3f8;
    --deep:#ffe0eb;
    --text:#2b2b2b;
    --card:#ffffff;
    --glow: 0 10px 30px rgba(255, 63, 142, .35);
  }

  html,body{
    height:100%;
    margin:0;
    font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--text);
    overflow:hidden;
    background:
      radial-gradient(1200px 800px at 10% -10%, #fff, transparent 60%),
      radial-gradient(1200px 800px at 110% 0%, var(--deep), transparent 60%),
      linear-gradient(160deg, #fff 0%, var(--light) 35%, #ffeaf3 100%);
  }

  /* Floating subtle hearts background */
  .bg{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.14;
  }
  .bg .float{
    position:absolute; font-size:28px;
    animation: drift linear infinite;
    filter: blur(.3px);
  }
  @keyframes drift{
    from{ transform: translateY(110vh) translateX(0) rotate(0deg); opacity:0; }
    12% { opacity:.8; }
    to  { transform: translateY(-15vh) translateX(60px) rotate(360deg); opacity:0; }
  }

  /* Center card */
  .wrap{
    position:relative; height:100%;
    display:grid; place-items:center; z-index:1;
    padding:18px;
  }
  .card{
    width:min(94vw, 680px);
    padding:34px 26px 40px;
    background:var(--card);
    border-radius:22px;
    box-shadow: 0 14px 42px rgba(255,63,142,.20), 0 6px 18px rgba(0,0,0,.05);
    text-align:center;
    position:relative;
    border: 1px solid #ffe0ee;
  }

  .ribbon{
    position:absolute; inset:auto auto -14px 50%; transform:translateX(-50%);
    background:linear-gradient(90deg, #ff8fb6, #ff3f8e, #ff8fb6);
    height:10px; width:160px; border-radius:99px; filter: blur(0.2px);
    opacity:.8;
  }

  h1{
    margin:0 0 10px;
    font-size:clamp(26px,5.2vw,40px);
    color:var(--pink);
    line-height:1.22;
    letter-spacing:.2px;
  }
  .subtitle{
    margin:0 0 8px; font-size:clamp(14px,3.5vw,16px); opacity:.7;
  }

  /* Buttons row */
  .btns{
    display:flex; align-items:center; justify-content:center;
    gap:16px; margin-top:18px;
    min-height:150px; position:relative;
  }

  button{
    cursor:pointer; border:none; padding:16px 28px;
    border-radius:999px; font-weight:700; font-size:20px;
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease, opacity .2s, left .12s ease, top .12s ease;
    will-change: transform, left, top; z-index:2;
  }

  .yes{
    background:linear-gradient(180deg, var(--pink), var(--hot));
    color:#fff; box-shadow: var(--glow);
    position:relative; transform-origin:center top;
    animation: softPulse 1.8s ease-in-out infinite;
  }
  .yes:hover{ transform: translateY(2px) scale(1.05); }
  @keyframes softPulse{
    0%,100%{ filter: drop-shadow(0 0 0 rgba(255,63,142,.0)); }
    50%{ filter: drop-shadow(0 0 10px rgba(255,63,142,.5)); }
  }

  .no{
    background:#fff; color:var(--pink); border:2px solid var(--pink);
    position:relative;
  }

  .footer{ margin-top:6px; font-size:14px; opacity:.65; }

  /* Overlay with GIF + "YAY" text */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; z-index:9999;
    padding:18px;
  }
  .overlay.show{ display:flex; }
  .overlay .wrapGif{
    position:relative; background:#000; padding:10px;
    border-radius:16px; max-width:min(94vw, 540px);
    box-shadow:0 18px 48px rgba(0,0,0,.45);
  }
  .overlay img{ width:100%; height:auto; display:block; border-radius:12px; }
  .overlay .yay{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    color:#fff; font-weight:900; font-size:clamp(28px, 6vw, 56px);
    text-shadow:0 2px 12px rgba(0,0,0,.45); letter-spacing:1px; pointer-events:none;
  }
  .overlay .hint{ color:#fff; text-align:center; margin-top:8px; font-size:13px; opacity:.85; }

  /* Falling hearts confetti */
  .heart{
    position:fixed; pointer-events:none; font-size:18px;
    animation: fall 1.6s linear forwards;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
    z-index:900;
  }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(360deg); opacity:.1; } }

  /* Music Control */
  .music{
    position:fixed; right:14px; bottom:14px; z-index:10000;
    display:flex; align-items:center; gap:8px;
    background:#ffffffd9; border:1px solid #ffd3e4; border-radius:999px;
    padding:8px 12px; box-shadow:0 8px 20px rgba(0,0,0,.08);
    backdrop-filter: blur(6px);
  }
  .music button{
    font-size:14px; padding:8px 14px; border-radius:999px;
    background:linear-gradient(180deg, #ffd3e4, #ffb0cf); color:#8a0b43; border:none;
  }
  .music .status{ font-size:13px; opacity:.7; }

  /* Small screens tweak */
  @media (max-width: 380px){
    .btns{ min-height: 130px; }
    button{ font-size:18px; padding:14px 22px; }
  }
</style>
</head>
<body>

  <!-- Light floating hearts background -->
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="card" id="card">
      <h1 id="title">Sakeena Fathima,<br/>will you be my Valentine? 💖</h1>
      <p class="subtitle">I promise unlimited smiles, cheesy jokes, and your favorite snacks. 😄</p>

      <div class="btns" id="btnRow">
        <button type="button" class="yes" id="yesBtn">Yes 💕</button>
        <button type="button" class="no"  id="noBtn">No 😅</button>
      </div>

      <div class="footer">(Try tapping “No”) 😉</div>
      <div class="ribbon"></div>
    </div>
  </div>

  <!-- Overlay with GIF + "YAY" text -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="wrapGif">
      <div class="yay">YAY 🎉</div>
      <img id="shockGif" alt="YAY!">
      <div class="hint">Tap anywhere to close</div>
    </div>
  </div>

  <!-- Music control (starts after first interaction due to browser policies) -->
  <div class="music" id="musicControl" aria-live="polite">
    <button id="musicBtn" type="button">Play music ▶️</button>
    <span class="status" id="musicStatus">Off</span>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // ====== Configure assets ======
  // 1) Background music: put "music.mp3" in your repo root, or use a direct URL
  const MUSIC_SRC   = './music.mp3'; // <-- replace if you host elsewhere
  // 2) GIF to show on "Yes"
  const shockGifUrl = "https://media.giphy.com/media/3kvYEldEEr0DC/giphy.gif";

  // ====== Elements ======
  const hearts = ['💖','💘','💝','💗','💕'];
  const title   = document.getElementById('title');
  const yesBtn  = document.getElementById('yesBtn');
  const noBtn   = document.getElementById('noBtn');
  const overlay = document.getElementById('overlay');
  const gifImg  = document.getElementById('shockGif');
  const bg      = document.getElementById('bg');

  const musicWrap  = document.getElementById('musicControl');
  const musicBtn   = document.getElementById('musicBtn');
  const musicStatus= document.getElementById('musicStatus');
  const audio      = new Audio(MUSIC_SRC);
  audio.loop = true;      // loop for romantic vibes
  audio.preload = 'auto';
  // NOTE: Many browsers require a user gesture to start audio.
  // We'll start music after any click/tap when user presses "Play" or says "Yes".

  // ====== Floating background hearts ======
  function spawnBgHearts(count=30){
    const vw = window.innerWidth;
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      s.className = 'float';
      s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      const left = Math.random()*vw;
      const delay = Math.random()*6;
      const dur   = 7 + Math.random()*6;
      s.style.left = left+'px';
      s.style.bottom = '-10vh';
      s.style.animationDuration = dur+'s';
      s.style.animationDelay = delay+'s';
      bg.appendChild(s);
    }
  }
  spawnBgHearts();

  // ====== NO roaming logic ======
  let roamingActivated = false;
  function activateRoaming(){
    if(roamingActivated) return;
    roamingActivated = true;
    noBtn.style.position = 'fixed';
    jumbleNo(); // first jump
  }
  function jumbleNo(){
    const btn  = noBtn.getBoundingClientRect();
    const pad  = 8;
    const maxX = Math.max(window.innerWidth  - btn.width  - pad, 0);
    const maxY = Math.max(window.innerHeight - btn.height - pad, 0);
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  }

  // YES grows slightly while chasing NO
  let yesScale = 1;
  function boostYes(){
    yesScale = Math.min(yesScale + 0.15, 2.0);
    yesBtn.style.transform = `translateY(10px) scale(${yesScale})`;
  }

  ['mouseenter','mousemove','mouseover','focus','touchstart','click'].forEach(evt=>{
    noBtn.addEventListener(evt, e => {
      e.preventDefault();
      activateRoaming();
      jumbleNo();
      boostYes();
    }, { passive:false });
  });

  // ====== Hearts confetti ======
  function spawnHearts(n=28){
    for(let i=0;i<n;i++){
      const span = document.createElement('span');
      span.className = 'heart';
      span.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      span.style.left = (Math.random()*100)+'vw';
      span.style.top  = '-5vh';
      span.style.transform = `translateY(0) rotate(${Math.random()*180}deg)`;
      span.style.fontSize = (14+Math.random()*16)+'px';
      document.body.appendChild(span);
      setTimeout(()=> span.remove(), 1800);
    }
  }

  // ====== Overlay open/close ======
  function openOverlay(){
    gifImg.src = shockGifUrl;
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
  }
  function closeOverlay(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
  }
  overlay.addEventListener('click', closeOverlay);

  // ====== Music control ======
  let musicOn = false;
  async function toggleMusic(forcePlay=false){
    try{
      if(forcePlay || !musicOn){
        await audio.play();
        musicOn = true;
        musicBtn.textContent = 'Pause music ⏸️';
        musicStatus.textContent = 'On';
      }else{
        audio.pause();
        musicOn = false;
        musicBtn.textContent = 'Play music ▶️';
        musicStatus.textContent = 'Off';
      }
    }catch(err){
      console.warn('Autoplay blocked until user gesture. Tap Play.', err);
    }
  }
  musicBtn.addEventListener('click', ()=> toggleMusic());

  // ====== YES behavior ======
  yesBtn.addEventListener('click', async () => {
    title.textContent = "YAY! 💘";
    spawnHearts(40);
    openOverlay();
    noBtn.disabled = true;
    noBtn.style.opacity = .45;

    // Try to start music when she says Yes
    await toggleMusic(true);
  });

});
</script>
</body>
</html>
